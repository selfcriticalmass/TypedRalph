[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codeact-agent"
version = "0.1.0"
description = "Terminal-native CodeAct agent with free and schema-constrained execution modes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.62.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
    "pandas>=2.2.2",
    "pyarrow>=16.1.0",
    "FlagEmbedding>=1.2.10",
    "transformers>=4.48.0",
    "huggingface-hub>=0.28.0",
    "accelerate>=1.2.1",
    "torch>=2.5.0",
    "sentencepiece>=0.2.0",
    "safetensors>=0.5.0",
    "openai>=1.30.0",
    "keyring>=25.2.1",
    "pillow>=12.2.0",
    "torchvision>=0.26.0",
]

[project.scripts]
codeact-agent = "ui.app:main"
codeact-diagnostics = "diagnostics:main"

[tool.setuptools]
py-modules = ["agent", "config", "diagnostics", "embed", "executor", "inference", "schema", "search"]
packages = ["ui"]
